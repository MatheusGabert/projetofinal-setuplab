<div class="container">
    <div class="d-flex justify-content-center">
        <h2>Componentes</h2>
    </div>

    <div class="w-25 mx-auto">
        <form [formGroup]="formComp" (ngSubmit)="cadastrarComp()" class="row g-2 mb-4">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome do componente:</label>
                <input type="text" class="form-control" id="nome" formControlName="nome" />
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label">Categoria</label>
                <select class="form-select" id="categoria" formControlName="categoria">
                    <option [ngValue]="null">Selecione uma categoria</option>
                    @for (categoria of categoria; track categoria) {
                    <option [ngValue]="categoria">{{ categoria }}</option>
                    }
                </select>
            </div>

            <div class="mb-3">
                <label for="marca" class="form-label">Marca:</label>
                <input type="text" class="form-control" id="marca" formControlName="marca" />
            </div>

            <div class="mb-3">
                <label for="preco" class="form-label">Preço:</label>
                <input type="number" class="form-control" id="preco" formControlName="preco" />
            </div>

            <div class="mb-3">
                <label for="configuracaoId" class="form-label">Configuração</label>
                <select class="form-select" id="configuracaoId" formControlName="configuracaoId">
                    <option [ngValue]="0">Selecione uma configuração</option>
                    @for (config of configsService.configs(); track config.id) {
                    <option [ngValue]="config.id">{{ config.nome }}</option>
                    }
                </select>
            </div>

            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary" [disabled]="formComp.invalid">Cadastrar</button>
            </div>
        </form>
    </div>

</div>
