<div class="container-fluid d-flex justify-content-center">
    <div class="mx-2 my-2" style="width: 30rem;">
        <div>
            @for(configuracao of configService.configs(); track configuracao.id){

            <div class="card text-center mb-2">
                <div class="card-header">
                    Configuração {{configuracao.id}}
                </div>
                <div class="card-body">
                    <h5 class="card-title">Orçamento: R$ {{ configuracao.orcamento}}</h5>
                    <p class="card-text">{{ configuracao.finalidade}}</p>
                    <!-- <a href="#" class="btn btn-primary">Go somewhere</a>-->
                </div>
                <div class="card-footer text-muted">
                    {{configuracao.dataCriacao}}
                </div>
            </div>

            }@empty {
            <p>Nenhuma configuração cadastrada</p>
            }

        </div>
    </div>

</div>
